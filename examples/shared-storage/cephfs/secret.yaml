# Credentials ceph-csi uses to mount the volume (nodeStageSecretRef in pv.yaml).
# For statically provisioned CephFS volumes ceph-csi expects the keys userID and userKey.
# Replace the placeholders, and prefer creating this Secret with kubectl or your secret manager
# instead of committing real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: csi-cephfs-secret
  namespace: default
type: Opaque
stringData:
  userID: <ceph-user-id>
  userKey: <ceph-user-key>
