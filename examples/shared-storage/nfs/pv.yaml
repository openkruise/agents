apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-skills-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: nfs.example.com
    path: /exports/shared-skills
