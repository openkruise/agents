# ══════════In-place update: pod-inplace-update-complete (success) + fail══════════
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-inplace-update-complete
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: DoesNotExist
      - key: '.metadata.annotations["agents.kruise.io/inplace-update-state"]'
        operator: Exists                     # in-place update in progress
      - key: '.status.containerStatuses.[] | select(.name == "sandbox") | .imageID'
        operator: NotIn
        values: ["kwok://inplace-updated"]   # container's imageid is not equal to value
      - key: '.status.containerStatuses.[] | select(.name == "sandbox") | .state.waiting.reason'
        operator: NotIn
        values: ["ImagePullBackOff"]
  delay:
    durationMilliseconds: 5000               # simulate pull new image + restart 5~12s
    jitterDurationMilliseconds: 12000
  next:
    statusSubresource: status
    statusTemplate: |
      {{ $now := Now }}
      containerStatuses:
      {{ range .spec.containers }}
      - name: {{ .name | Quote }}
        image: {{ .image | Quote }}
        imageID: "kwok://inplace-updated"    # imageID changes → judged complete
        ready: true
        started: true
        restartCount: 1
        state: { running: { startedAt: {{ $now | Quote }} } }
      {{ end }}
  weight: 999
---
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-inplace-update-fail
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: DoesNotExist
      - key: '.metadata.annotations["agents.kruise.io/inplace-update-state"]'
        operator: Exists
      - key: '.status.containerStatuses.[] | select(.name == "sandbox") | .imageID'
        operator: NotIn
        values: ["kwok://inplace-updated"]
      - key: '.status.containerStatuses.[] | select(.name == "sandbox") | .state.waiting.reason'
        operator: NotIn
        values: ["ImagePullBackOff"]
  delay:
    durationMilliseconds: 5000
    jitterDurationMilliseconds: 12000
  next:
    statusSubresource: status
    statusTemplate: |
      {{ range .spec.containers }}
      - name: {{ .name | Quote }}
        image: {{ .image | Quote }}
        # Do NOT change imageID (keep the old value) → IsInplaceUpdateCompleted judges "not complete" = real failure
        ready: false
        state:
          waiting:
            reason: "ImagePullBackOff"
            message: "simulated in-place update image pull failure"
      {{ end }}
  weight: 1


