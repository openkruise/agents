name: License
on:
  push:
    branches:
      - master
      - release-*
  workflow_dispatch: {}
  pull_request:
    branches:
      - master
      - release-*

# Declare default permissions as read only.
permissions: read-all

jobs:
  license_check:
    runs-on: ubuntu-24.04
    name: Check for unapproved licenses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: 2.6
      - name: Install dependencies
        # A Gemfile/Gemfile.lock cannot replace this: license_finder caps
        # rubyzip below the version that fixes CVE-2026-85396, so a committed
        # lockfile would add a HIGH Trivy finding instead.
        run: gem install license_finder -v 7.2.1 --no-document  # zizmor: ignore[adhoc-packages] -- no lockfile avoids the vulnerable rubyzip
      - name: Run tests
        run: license_finder --decisions_file .license/dependency_decisions.yml