name: E2E-Tracing

on:
  push:
    branches:
      - master
      - release-*
  pull_request: {}
  workflow_dispatch: {}

# Declare default permissions as read only.
permissions: read-all

env:
  # Common versions
  GO_VERSION: '1.25'
  KIND_VERSION: 'v0.22.0'
  KIND_IMAGE: 'kindest/node:v1.32.0'
  KIND_CLUSTER_NAME: 'ci-testing'

jobs:
  tracing-stdout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: ${{ env.KIND_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: ./test/kind-conf.yaml
          version: ${{ env.KIND_VERSION }}
      - name: Build image
        run: |
          export IMAGE="agent-sandbox-controller:latest"
          docker build -f dockerfiles/agent-sandbox-controller.Dockerfile  --pull --no-cache . -t $IMAGE
          kind load docker-image --name=${KIND_CLUSTER_NAME} $IMAGE || { echo >&2 "kind not installed or error loading image: $IMAGE"; exit 1; }
          export MANAGER_IMAGE="sandbox-manager:latest"
          docker build -f dockerfiles/sandbox-manager.Dockerfile --pull . -t $MANAGER_IMAGE
          kind load docker-image --name=${KIND_CLUSTER_NAME} $MANAGER_IMAGE || { echo >&2 "kind not installed or error loading image: $MANAGER_IMAGE"; exit 1; }
      - name: Install Kruise Agents with stdout tracing
        run: |
          CONTROLLER_IMG=agent-sandbox-controller:latest make deploy-agent-sandbox-controller
          # Enable the std tracing exporter so controller spans are written to
          # stdout, where the Tracing Stdout E2E suite asserts on them.
          kubectl -n sandbox-system patch deployment sandbox-controller-manager \
            --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--tracing-mode=std"}]'
          # Wait for the rolling update triggered by the patch to complete before
          # running wait-agent-sandbox-controller.sh, which only checks pod readiness
          # and can falsely pass by seeing the OLD (pre-patch) pod.
          kubectl -n sandbox-system rollout status deployment/sandbox-controller-manager --timeout=120s
          bash hack/wait-agent-sandbox-controller.sh
      - name: Install sandbox-manager with stdout tracing
        run: |
          # Enable the std tracing exporter on the manager as well so the
          # Tracing Full Chain E2E suite can assert on both stdouts. Reduce
          # resource requests to fit the CI runner.
          {
            echo ""
            echo "# Enable stdout tracing for the Tracing Full Chain E2E suite"
            echo "- op: add"
            echo "  path: /spec/template/spec/containers/0/args/-"
            echo "  value: --tracing-mode=std"
            echo "- op: replace"
            echo "  path: /spec/template/spec/containers/0/resources/requests"
            printf '  value: {"cpu":"100m","memory":"256Mi"}\n'
            echo "- op: replace"
            echo "  path: /spec/template/spec/containers/1/resources/requests"
            printf '  value: {"cpu":"50m","memory":"128Mi"}\n'
          } >> config/sandbox-manager/configuration_patch.yaml
          make deploy-sandbox-manager
          kubectl -n sandbox-system rollout status deployment/sandbox-manager --timeout=300s
      - name: Port-forward sandbox-manager
        run: |
          # Expose the manager E2B API to the runner for the Tracing Full
          # Chain suite. The Service port 7788 fronts the envoy sidecar
          # (sandbox traffic proxy), NOT the manager API, so forward to the
          # manager container port 8080 (http-manager) directly. Redirect
          # output so the step does not hang waiting for the background
          # process; it keeps running across steps.
          nohup kubectl -n sandbox-system port-forward deployment/sandbox-manager 7788:8080 >/tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7788/health >/dev/null; then
              echo "sandbox-manager is reachable"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:7788/health >/dev/null || {
            cat /tmp/port-forward.log
            echo "===== sandbox-manager pods ====="
            kubectl -n sandbox-system get pods -o wide
            kubectl -n sandbox-system describe deployment sandbox-manager | tail -20
            kubectl -n sandbox-system logs deployment/sandbox-manager -c controller --tail=50 || true
            echo >&2 "sandbox-manager not reachable via port-forward"
            exit 1
          }
      - name: Run Tracing E2E Tests
        run: |
          export KUBECONFIG=/home/runner/.kube/config
          export TRACING_E2E_MANAGER_URL=http://localhost:7788
          hack/run-agents-e2e-test.sh --print-info --focus 'Tracing'
