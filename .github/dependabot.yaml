# This YAML configuration file is used to enable Dependabot for automated dependency management.
# Dependabot helps keep the project's dependencies up-to-date by automatically creating pull requests
# for outdated dependencies based on the version constraints defined in your project.
# For more information and customization options, please refer to the Dependabot documentation:
# Documentation: https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically
# Configuration options: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
# Go module updates. Without this entry Dependabot raises no PRs for Go
# dependencies at all, which means CVEs in go.mod are never auto-remediated
# and govulncheck/Trivy findings have to be fixed by hand.
- package-ecosystem: "gomod"
  directory: "/"
  open-pull-requests-limit: 10
  schedule:
    interval: "weekly"
  groups:
    # Keep the PR volume manageable: k8s and otel release many modules in
    # lockstep and must be bumped together anyway.
    k8s:
      patterns:
        - "k8s.io/*"
        - "sigs.k8s.io/*"
    otel:
      patterns:
        - "go.opentelemetry.io/*"
    golang-x:
      patterns:
        - "golang.org/x/*"
  # NOTE: intentionally no `ignore:` rules here. Dependabot ignore conditions
  # apply to security updates as well as version updates, so silencing a
  # dependency also silences its CVE PRs. If the PR volume is too high, prefer
  # widening the `groups` above or lowering open-pull-requests-limit.

- package-ecosystem: "github-actions"
  directory: "/"
  # Allow up to 10 open pull requests for update github-actions
  # 5 by default
  # see https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit
  open-pull-requests-limit: 10
  schedule:
    # Check for updates to GitHub Actions every week
    interval: "weekly"
