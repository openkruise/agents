[build-system]
requires = [
  "setuptools>=80.0",
  "wheel>=0.46",
  "datamodel-code-generator==0.75.0",
  "certifi",
]
build-backend = "setuptools.build_meta"

[project]
name = "openkruise-agents"
version = "0.1.0"
description = "OpenKruise Agents resource-management SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenKruise" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["build>=1.2", "datamodel-code-generator==0.75.0", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
