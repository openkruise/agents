# Permissions for agent-identity-provider.
#
# Declared with the component rather than generated into controller-role,
# because this process is a separate failure domain from
# agent-sandbox-controller and must not inherit its permissions or lend it
# these. Same approach as config/sandbox-manager/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-identity-provider
  labels:
    component: agent-identity-provider
    app.kubernetes.io/name: agent-identity-provider
rules:
  # The AgentIdentity controller reads identities and the configs they
  # reference, and writes only the identity's status.
  - apiGroups: ["security.agents.kruise.io"]
    resources: ["agentidentities", "agentauthenticationconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.agents.kruise.io"]
    resources: ["agentidentities/status", "agentauthenticationconfigs/status"]
    verbs: ["get", "update", "patch"]
  # Discovery decides whether the AgentIdentity CRD is installed before the
  # controller registers itself.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-identity-provider
  labels:
    component: agent-identity-provider
    app.kubernetes.io/name: agent-identity-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-identity-provider
subjects:
  - kind: ServiceAccount
    name: agent-identity-provider
    namespace: sandbox-system
