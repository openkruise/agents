apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-identity-provider
  namespace: sandbox-system
  labels:
    component: agent-identity-provider
    app.kubernetes.io/name: agent-identity-provider
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      component: agent-identity-provider
      app.kubernetes.io/name: agent-identity-provider
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: identity-provider
      labels:
        component: agent-identity-provider
        app.kubernetes.io/name: agent-identity-provider
    spec:
      serviceAccountName: agent-identity-provider
      containers:
        - name: identity-provider
          image: agent-identity-provider:latest
          imagePullPolicy: IfNotPresent
          command:
            - /agent-identity-provider
          args:
            - --leader-elect=true
            - --zap-log-level=info
            # Token issuance is opt-in. Without --signing-key-file the process
            # runs the AgentIdentity controller alone. Supplying a key requires
            # TLS as well, because the JWKS decides which keys verifiers trust
            # and must not be served over plaintext.
            # - --issuer-url=https://agent-identity-provider.sandbox-system.svc:8443
            # - --signing-key-file=/etc/agent-identity/signing/tls.key
            # - --tls-cert-file=/etc/agent-identity/serving/tls.crt
            # - --tls-key-file=/etc/agent-identity/serving/tls.key
          # volumeMounts:
          #   - name: signing-key
          #     mountPath: /etc/agent-identity/signing
          #     readOnly: true
          #   - name: serving-cert
          #     mountPath: /etc/agent-identity/serving
          #     readOnly: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
            - containerPort: 8443
              name: issuer
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      # volumes:
      #   - name: signing-key
      #     secret:
      #       secretName: agent-identity-signing-key
      #   - name: serving-cert
      #     secret:
      #       secretName: agent-identity-serving-cert
      terminationGracePeriodSeconds: 10
