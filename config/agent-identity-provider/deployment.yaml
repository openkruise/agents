apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-identity-provider
  namespace: sandbox-system
  labels:
    component: agent-identity-provider
    app.kubernetes.io/name: agent-identity-provider
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      component: agent-identity-provider
      app.kubernetes.io/name: agent-identity-provider
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: identity-provider
      labels:
        component: agent-identity-provider
        app.kubernetes.io/name: agent-identity-provider
    spec:
      serviceAccountName: agent-identity-provider
      containers:
        - name: identity-provider
          image: agent-identity-provider:latest
          imagePullPolicy: IfNotPresent
          command:
            - /agent-identity-provider
          args:
            - --leader-elect=true
            - --zap-log-level=info
            # Token issuance is opt-in. Without --signing-key-file the process
            # runs the AgentIdentity controller alone. Supplying a key requires
            # TLS as well, because the JWKS decides which keys verifiers trust
            # and must not be served over plaintext.
            # - --issuer-url=https://agent-identity-provider.sandbox-system.svc:8443
            # - --signing-key-file=/etc/agent-identity/signing/tls.key
            # - --tls-cert-file=/etc/agent-identity/serving/tls.crt
            # - --tls-key-file=/etc/agent-identity/serving/tls.key
            # Credential storage is opt-in in the same way. The directory holds
            # one file per key ID beside an "active" file naming which of them
            # seals new records, so a rotation can be staged.
            #
            # These keys must not come from a Secret this process reads through
            # the API. Session and delegation records live in Secrets in
            # sandbox-system, and a root key held in a Secret there would be
            # reachable by the same RBAC grant that reaches the ciphertext it
            # protects. How the files arrive is a deployment decision: a
            # projected volume, a secret driver and a KMS sidecar all present a
            # directory of files.
            # - --encryption-key-dir=/etc/agent-identity/encryption
          # volumeMounts:
          #   - name: signing-key
          #     mountPath: /etc/agent-identity/signing
          #     readOnly: true
          #   - name: serving-cert
          #     mountPath: /etc/agent-identity/serving
          #     readOnly: true
          #   - name: encryption-keys
          #     mountPath: /etc/agent-identity/encryption
          #     readOnly: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
            - containerPort: 8443
              name: issuer
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      # volumes:
      #   - name: signing-key
      #     secret:
      #       secretName: agent-identity-signing-key
      #   - name: serving-cert
      #     secret:
      #       secretName: agent-identity-serving-cert
      #   - name: encryption-keys
      #     # Source deliberately left unspecified. This Deployment runs in
      #     # sandbox-system, which is also where session and delegation
      #     # records are stored, so a Secret here would put the root key
      #     # behind the same RBAC grant as the ciphertext it protects and
      #     # encrypting under it would protect nothing.
      #     #
      #     # Use a source whose read access is separable from Secrets in this
      #     # namespace: a CSI secret driver, a KMS-backed projection, or a
      #     # Secret in a namespace only this ServiceAccount can read.
      terminationGracePeriodSeconds: 10
