---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agentidentities.security.agents.kruise.io
spec:
  group: security.agents.kruise.io
  names:
    categories:
    - agents
    kind: AgentIdentity
    listKind: AgentIdentityList
    plural: agentidentities
    shortNames:
    - aid
    singular: agentidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentIdentity declares a logical agent that sandboxes can assume.

          A Sandbox selects one through the security.agents.kruise.io/agent-name
          annotation. The name must resolve to a Ready AgentIdentity in the sandbox's
          own namespace; issuance fails closed rather than falling back to another
          identity or an unsigned token.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the agent identity.
            properties:
              authenticationRefs:
                description: |-
                  AuthenticationRefs lists the issuers allowed to authenticate end users
                  delegating to this agent. At least one is required.

                  An identity that names no issuer cannot take part in a principal token
                  exchange, so it is not usable and must not report Ready. The constraint is
                  declared here rather than left to the controller so the API server rejects
                  an empty list outright, but the controller still fails an existing object
                  closed: an object created before this constraint can carry an empty list
                  that admission never saw.
                items:
                  description: |-
                    AuthenticationConfigReference names an AgentAuthenticationConfig in the same
                    namespace.

                    Cross-namespace references are not supported: a namespace must not be able to
                    borrow another namespace's trusted issuer.
                  properties:
                    apiGroup:
                      description: APIGroup of the referent. Only security.agents.kruise.io
                        is accepted.
                      enum:
                      - security.agents.kruise.io
                      type: string
                    kind:
                      description: Kind of the referent. Only AgentAuthenticationConfig
                        is accepted.
                      enum:
                      - AgentAuthenticationConfig
                      type: string
                    name:
                      description: Name of the referent in the same namespace.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - apiGroup
                  - kind
                  - name
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - authenticationRefs
            type: object
          status:
            description: Status is the current state of the identity.
            properties:
              conditions:
                description: |-
                  Conditions holds the observations of the identity's state. Ready is True
                  when the current generation validated and every referenced
                  AgentAuthenticationConfig is itself Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
