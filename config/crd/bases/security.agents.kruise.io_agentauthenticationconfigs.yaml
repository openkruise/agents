    - agents
    kind: AgentAuthenticationConfig
    listKind: AgentAuthenticationConfigList
    plural: agentauthenticationconfigs
    shortNames:
    - aac
    singular: agentauthenticationconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.issuer
      name: Issuer
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentAuthenticationConfig declares an OIDC issuer trusted to authenticate end
          users for the agents in its namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the trusted issuer.
            properties:
              jwt:
                description: JWT configures the trusted OIDC issuer. Required when
                  Type is JWT.
                properties:
                  allowedAudience:
                    description: |-
                      AllowedAudience lists the audiences accepted in an ID token. An ID token
                      naming none of these is rejected, which is what stops a token minted for
                      another application being replayed here.
                    items:
