---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: credentialproviders.security.agents.kruise.io
spec:
  group: security.agents.kruise.io
  names:
    categories:
    - agents
    kind: CredentialProvider
    listKind: CredentialProviderList
    plural: credentialproviders
    shortNames:
    - acp
    singular: credentialprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.callbackUrl
      name: Callback
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CredentialProvider declares a third-party OAuth client that agents in its
          namespace may obtain user-delegated tokens through.

          An AgentRole grants access to a named provider; a wildcard is not accepted
          there, so adding a provider never widens an existing role.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the provider.
            properties:
              oauth2:
                description: |-
                  OAuth2 configures the third-party OAuth client. Required when Type is
                  oauth2.
                properties:
                  client:
                    description: Client is the registered application.
                    properties:
                      clientId:
                        description: ClientID of the registered application. Not a
                          secret.
                        maxLength: 512
                        minLength: 1
                        type: string
                      clientSecret:
                        description: |-
                          ClientSecret references the Secret holding the client secret. It is a
                          reference rather than a value so the secret never appears in this object,
                          which is readable by anything that can read the CRD.
                        properties:
                          secretKeyRef:
                            description: SecretKeyRef names the Secret and key holding
                              the value.
                            properties:
                              key:
                                description: Key within that Secret holding the value.
                                maxLength: 253
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret in the same namespace.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - secretKeyRef
                        type: object
                    required:
                    - clientId
                    - clientSecret
                    type: object
                  discovery:
                    description: Discovery locates the provider's OAuth endpoints.
                    properties:
                      authorizationEndpoint:
                        description: AuthorizationEndpoint is where the user is sent
                          to approve access.
                        pattern: ^https://
                        type: string
                      issuer:
                        description: Issuer identifies the provider.
                        pattern: ^https://
                        type: string
                      tokenEndpoint:
                        description: TokenEndpoint is where an authorization code
                          is exchanged for a token.
                        pattern: ^https://
                        type: string
                    required:
                    - authorizationEndpoint
                    - issuer
                    - tokenEndpoint
                    type: object
                  grantType:
                    description: |-
                      GrantType selects the flow. The only supported value is "userFederation":
                      a user approving an agent's access to their own account.
                    enum:
                    - userFederation
                    type: string
                  userFederation:
                    description: |-
                      UserFederation configures the approval flow. Required when GrantType is
                      userFederation.
                    properties:
                      callbackBaseUrl:
                        description: |-
                          CallbackBaseURL is the externally reachable base the callback is served
                          under. The controller appends CallbackPath to form status.callbackUrl,
                          which is what gets registered with the third party.

                          A query, fragment or user information here would produce a redirect URI
                          that cannot match the registration, so they are rejected rather than
                          silently dropped.
                        maxLength: 2048
                        pattern: ^https://[^/?#@]+(/[^?#]*)?$
                        type: string
                      defaultScopes:
                        description: |-
                          DefaultScopes are requested when a caller names none. A caller may request
                          a subset but never more, so this is the ceiling on what any agent in this
                          namespace can be granted through this provider.
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 32
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - callbackBaseUrl
                    - defaultScopes
                    type: object
                required:
                - client
                - discovery
                - grantType
                type: object
                x-kubernetes-validations:
                - message: userFederation is required when grantType is userFederation
                  rule: self.grantType != 'userFederation' || has(self.userFederation)
              type:
                description: |-
                  Type selects the credential mechanism. The only supported value is
                  "oauth2".
                enum:
                - oauth2
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: oauth2 is required when type is oauth2
              rule: self.type != 'oauth2' || has(self.oauth2)
          status:
            description: Status is the current state of the provider.
            properties:
              callbackUrl:
                description: |-
                  CallbackURL is callbackBaseUrl with CallbackPath appended. It is derived
                  rather than configured so that what an operator registers with the third
                  party is exactly what the server will accept, with no chance of the two
                  drifting apart.
                type: string
              conditions:
                description: |-
                  Conditions holds the observations of the provider's state. Ready is True
                  when the current generation validated and the client secret was loaded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
