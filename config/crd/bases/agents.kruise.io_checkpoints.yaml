---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: checkpoints.agents.kruise.io
spec:
  group: agents.kruise.io
  names:
    kind: Checkpoint
    listKind: CheckpointList
    plural: checkpoints
    shortNames:
    - cp
    singular: checkpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Checkpoint is the Schema for the Checkpoints API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Checkpoint
            properties:
              containers:
                description: |-
                  Containers lists the names of containers to checkpoint.
                  An empty list means all eligible containers in the Pod.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              keepRunning:
                description: |-
                  KeepRunning indicates whether the pod remains in the Running state after passing the checkpoint.
                  Default is true.
                type: boolean
              persistentContents:
                description: 'PersistentContents indicates resume pod with persistent
                  content, Enum: podInfo, memory, filesystem, gpuMemory'
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              podName:
                description: PodName is checkpoint podName.
                type: string
              sandboxName:
                description: SandboxName is checkpoint sandboxName.
                type: string
              ttlAfterFinished:
                description: 'valid format: 30s, 30m, 30d'
                type: string
            type: object
          status:
            description: status defines the observed state of Checkpoint
            properties:
              checkpointId:
                description: checkpoint-id
                type: string
              checkpointLocation:
                description: CheckpointLocation describes where the checkpoint artifacts
                  are stored.
                properties:
                  remote:
                    description: Remote locates checkpoint artifacts in remote storage.
                    properties:
                      endpoint:
                        description: Endpoint identifies the remote storage root.
                        minLength: 1
                        type: string
                      path:
                        description: Path is the artifact path relative to Endpoint.
                        minLength: 1
                        type: string
                    required:
                    - endpoint
                    - path
                    type: object
                  type:
                    description: Type identifies the checkpoint storage backend.
                    enum:
                    - Remote
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: remote must be set when type is Remote
                  rule: self.type != 'Remote' || has(self.remote)
              completionTime:
                description: CompletionTime is checkpoint completed time, and phase
                  is Succeeded or Failed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the checkpoint.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: message
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed for this Checkpoint. It corresponds to the
                  Checkpoint's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
              phase:
                description: Checkpoint Phase
                type: string
              podTemplateDelta:
                description: |-
                  PodTemplateDelta stores a Strategic Merge Patch that captures the delta between
                  the running Pod at pause time and the base Pod generated from sandbox.spec.template
                x-kubernetes-preserve-unknown-fields: true
              rebuildCount:
                description: |-
                  RebuildCount is the number of times the checkpoint was found unhealthy
                  and scheduled to be rebuilt in place.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
