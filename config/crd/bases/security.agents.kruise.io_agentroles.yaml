---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agentroles.security.agents.kruise.io
spec:
  group: security.agents.kruise.io
  names:
    categories:
    - agents
    kind: AgentRole
    listKind: AgentRoleList
    plural: agentroles
    shortNames:
    - arole
    singular: agentrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRole declares a set of permitted identity and credential actions.

          A role grants nothing on its own. An AgentRoleBinding is what attaches it to
          an AgentIdentity, and deleting that binding withdraws the permissions from
          the next request onward.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the permitted actions.
            properties:
              rules:
                description: |-
                  Rules granting permissions. An empty list is a role that permits nothing,
                  which is valid but useless, so at least one is required to make an
                  accidentally empty role visible at admission instead of at request time.

                  The CEL rule enforces the one constraint that cannot be expressed per
                  field: GetResourceOAuth2Token must name a provider exactly, because a
                  wildcard would also grant every CredentialProvider added in future.
                items:
                  description: |-
                    AgentRoleRule permits a set of actions on a set of resources.

                    A resource is either "*" or "<Kind>/<name>", naming what the action applies
                    to. Which kinds are meaningful depends on the action: ExchangePrincipalToken
                    acts on an AgentIdentity, GetResourceOAuth2Token on a CredentialProvider.
                  properties:
                    actions:
                      description: Actions permitted by this rule.
                      items:
                        enum:
                        - ExchangePrincipalToken
                        - GetResourceOAuth2Token
                        type: string
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    resources:
                      description: Resources the actions apply to, as "*" or "<Kind>/<name>".
                      items:
                        maxLength: 317
                        minLength: 1
                        type: string
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - actions
                  - resources
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: GetResourceOAuth2Token must name a CredentialProvider exactly
                    and cannot use a wildcard
                  rule: self.all(r, !('GetResourceOAuth2Token' in r.actions) || !r.resources.exists(x,
                    x.contains('*')))
            required:
            - rules
            type: object
          status:
            description: Status is the current state of the role.
            properties:
              conditions:
                description: |-
                  Conditions holds the observations of the role's state. Ready is True when
                  the current generation validated.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
