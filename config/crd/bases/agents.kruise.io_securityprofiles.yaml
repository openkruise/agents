                              properties:
                                credentialProvider:
                                  description: CredentialProvider fetches credentials
                                    from an external provider.
                                  properties:
                                    name:
                                      description: Name is the provider name.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace is reserved for namespace-scoped provider lookup. It is
                                        currently ignored.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    parameters:
                                      additionalProperties:
                                        description: |-
                                          ValueSource produces one provider metadata value. Exactly one of Value,
                                          Cel, or Template must be set. Value and Template produce strings; Cel may
                                          produce any JSON-compatible value.
                                        properties:
                                          cel:
                                            description: |-
                                              Cel is a CEL expression evaluated against the request, Pod, profile,
                                              rule, and inputs context.
                                            maxLength: 1024
                                            minLength: 1
                                            type: string
                                          template:
                                            description: Template is a Go template
                                              whose rendered output is the value.
                                            maxLength: 2048
                                            minLength: 1
                                            type: string
                                          value:
                                            description: Value is a static string
                                              emitted verbatim.
                                            maxLength: 2048
                                            type: string
                                        type: object
                                      description: |-
                                        Parameters supplies values rendered into the provider request's
                                        extraMetadata field.
                                      type: object
                                  required:
                                  - name
                                  type: object
                                kind:
                                  description: |-
                                    Kind identifies the deprecated credential source type.
                                    Deprecated: use Secret or CredentialProvider.
                                  enum:
                                  - Secret
                                  - CredentialProvider
                                  type: string
                                name:
                                  description: |-
                                    Name identifies the deprecated credential source.
                                    Deprecated: use Secret or CredentialProvider.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                namespace:
                                  description: |-
                                    Namespace is used by deprecated Secret references. It is ignored by
                                    deprecated CredentialProvider references.
                                    Deprecated: use Secret.Namespace instead.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                secret:
                                  description: Secret references credentials stored
                                    in a Kubernetes Secret.
                                  properties:
                                    name:
                                      description: Name is the Secret name.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                    namespace:
                                      description: |-
                                        Namespace is the Secret namespace. When omitted, a SecurityProfile uses
                                        its own namespace and a GlobalSecurityProfile uses the selected Pod's
                                        namespace.
                                      maxLength: 253
                                      minLength: 1
                                      type: string
                                  required:
                                  - name
                                  type: object
                              type: object
                            disabled:
                              default: false
                              description: Disabled skips the action without removing
                                its configuration.
                              type: boolean
                            failStrategy:
                              default: Block
                              description: |-
                                FailStrategy controls behavior when the transformation fails.
                                Defaults to Block (fail closed).
                              enum:
