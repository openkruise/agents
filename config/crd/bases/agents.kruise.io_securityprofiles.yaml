                        block:
                          description: |-
                            Block is a terminal action that returns a configured HTTP response
                            to the client without forwarding upstream.
                          properties:
                            body:
                              description: Body is an optional response body sent
                                verbatim to the client.
                              type: string
                            statusCode:
                              default: 403
                              description: StatusCode is the HTTP status returned
                                to the client.
                              format: int32
                              maximum: 599
                              minimum: 100
                              type: integer
                          type: object
                        bypass:
                          description: |-
                            Bypass forwards the request and skips all remaining actions and rules
                            across matching profiles. False is equivalent to omission.
                          type: boolean
                        mcpToolPolicy:
                          description: |-
                            MCPToolPolicy defines inline MCP tool access control rules.
                            Non-terminal when the policy allows; terminal (like Block) when
                            denied.
                          properties:
                            defaultAction:
                              default: deny
                              description: |-
                                DefaultAction is the decision applied when no rule matches.
                                Defaults to "deny" (whitelist mode); set "allow" for blacklist mode.
                              enum:
                              - allow
                              - deny
                              type: string
                            denyResponse:
                              description: DenyResponse configures the HTTP response
                                when a tool is denied.
                              properties:
                                body:
                                  description: Body is the optional response body
                                    sent to the client.
                                  type: string
                                statusCode:
                                  default: 403
                                  description: StatusCode is the HTTP status returned
                                    to the client. Defaults to 403.
                                  format: int32
                                  maximum: 599
                                  minimum: 100
                                  type: integer
                              type: object
                            rules:
                              description: Rules are evaluated in order. First match
                                wins.
                              items:
                                description: MCPToolPolicyRule defines one allow or
                                  deny rule for an MCP tool call.
                                properties:
                                  action:
                                    description: Action determines whether the matching
                                      tool call is allowed or denied.
                                    enum:
                                    - allow
                                    - deny
                                    type: string
                                  method:
                                    description: |-
                                      Method is the JSON-RPC method. Only "tools/call" is currently enforced;
