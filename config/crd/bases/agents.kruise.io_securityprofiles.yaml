                                    items:
                                      type: string
                                    type: array
                                required:
                                - action
                                - method
                                type: object
                              minItems: 1
                              type: array
                            unsupportedVersionAction:
                              default: deny
                              description: |-
                                UnsupportedVersionAction determines how a tools/call request with a
