                                  maxLength: 256
                                  minLength: 1
                                  pattern: ^[A-Za-z0-9!$&'()*+,\-./:;=?@_~\[\]]+$
                                  type: string
                                type:
                                  default: Exact
                                  description: Type selects the matching strategy.
                                    Defaults to Exact.
                                  enum:
                                  - Exact
                                  - Prefix
                                  - Regex
                                  type: string
                                value:
                                  description: |-
                                    Value is the match operand. For Exact/Prefix it is compared
                                    verbatim against the percent-decoded query value; for Regex it is
                                    interpreted as an RE2 expression.
                                  maxLength: 512
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                          schemes:
                            description: |-
                              Schemes lists request schemes, such as "http" and "https". Multiple
                              entries are ORed, and matching is case-insensitive.
                            items:
                              maxLength: 32
                              minLength: 1
                              pattern: ^[a-zA-Z][a-zA-Z0-9+\-.]*$
                              type: string
                            type: array
                        required:
                        - domains
                        type: object
                      minItems: 1
                      type: array
                    name:
                      description: |-
                        Name uniquely identifies the rule within the profile. Used in
