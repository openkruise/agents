                          required:
                          - credentialRef
                          type: object
                      type: object
                    match:
                      description: Match lists match conditions. Multiple entries
                        are ORed.
                      items:
                        description: |-
                          RuleMatch is a conjunctive match condition. Multiple RuleMatch entries
                          inside a rule's match list are ORed; fields inside one RuleMatch are ANDed.

                          Domains is required. All other fields further restrict the match.
                        properties:
                          domains:
                            description: |-
                              Domains lists target host names. "*" matches any host, and a leading
                              wildcard such as "*.example.com" matches subdomains.
                            items:
                              type: string
                            minItems: 1
                            type: array
                          headers:
                            description: Headers lists header matches; multiple entries
                              are ANDed.
                            items:
                              description: |-
                                HeaderMatch filters a request by a single header's value.
                                Multiple HeaderMatch entries in one RuleMatch are ANDed.
                              properties:
                                name:
                                  description: |-
                                    Name is the header name (case-insensitive). Restricted to a safe
                                    subset of RFC 7230 tchar characters.
                                  maxLength: 256
                                  minLength: 1
                                  pattern: ^[A-Za-z0-9!#$%&'*+\-.^_|~]+$
                                  type: string
                                type:
                                  default: Exact
                                  description: Type selects the matching strategy.
                                    Defaults to Exact.
                                  enum:
                                  - Exact
                                  - Prefix
                                  - Regex
                                  type: string
                                value:
                                  description: |-
                                    Value is the match operand. For Exact/Prefix it is compared
                                    verbatim; for Regex it is interpreted as an RE2 expression.
                                  maxLength: 512
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                          methods:
                            description: Methods lists HTTP methods. Multiple entries
                              are ORed.
                            items:
                              enum:
                              - GET
                              - HEAD
                              - POST
                              - PUT
                              - PATCH
                              - DELETE
                              - OPTIONS
                              - CONNECT
                              - TRACE
                              type: string
                            type: array
                          paths:
                            description: |-
                              Paths lists URL path matches. Multiple entries are ORed. The query
                              string is excluded from path matching.
                            items:
                              description: PathMatch specifies how to match the request
                                URL path.
                              properties:
                                type:
                                  default: Prefix
                                  description: Type selects the path matching strategy.
                                    Defaults to Prefix.
                                  enum:
                                  - Prefix
                                  - Exact
                                  - Regex
                                  type: string
                                value:
                                  description: Value is the match value. For Regex,
                                    it is an RE2 expression.
                                  maxLength: 256
                                  minLength: 1
                                  type: string
                              required:
                              - type
                              - value
                              type: object
                            type: array
                          ports:
                            description: |-
                              Ports lists destination ports. Multiple entries are ORed.

                              An explicit authority port is used directly. Otherwise, HTTP defaults
                              to 80 and HTTPS defaults to 443. Other schemes have no default port.
                            items:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            type: array
                          queryParams:
                            description: |-
                              QueryParams lists URL query parameter matches. Multiple entries are
                              ANDed. Values are percent-decoded before matching.
                            items:
                              description: |-
                                QueryParamMatch filters a request by one URL query parameter.
                                Multiple QueryParamMatch entries in one RuleMatch are ANDed.

                                When a key appears more than once, only its first value is matched.
                              properties:
                                name:
                                  description: Name is the case-sensitive query parameter
