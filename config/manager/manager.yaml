apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: sandbox-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: v1
kind: Service
metadata:
  name: controller-manager-webhook-service
  namespace: system
  labels:
    control-plane: sandbox-controller-manager
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: sandbox-controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: sandbox-controller-manager
    app.kubernetes.io/name: sandbox-controller-manager
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: sandbox-controller-manager
      app.kubernetes.io/name: sandbox-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: sandbox-controller-manager
        app.kubernetes.io/name: sandbox-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --webhook-cert-path=/home/nonroot/sandbox-controller-webhook-certs
          # Optional: actively sync routes to manager/gateway; disabled by default.
          # - --feature-gates=SandboxRouteSync=true
          # 选择 sandbox-system 中可通过 PodIP 访问的 seed Pods；空 selector 禁用同步。
          # - --peer-selector=app=sandbox-peer
          # - --memberlist-bind-port=7946
          # 按部署设置网卡；空值使用 POD_IP 或首个非回环 IPv4。
          # - --network-interface=
          # 启用前先升级接收方，并确认整个 peer group 的 HTTP/mTLS 配置一致。
          # OpenTelemetry tracing (uncomment to enable).
          # The bundled demo Collector (config/otel-collector) serves plaintext
          # gRPC without TLS, hence insecure=true; switch to false only after
          # configuring TLS on the Collector.
          # - --tracing-mode=otel
          # - --tracing-endpoint=otel-collector:4317
          # - --tracing-insecure=true
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        env:
          - name: AGENT_JOB_IMAGE
            value: commit-job:latest
          - name: CLUSTER_ID
            value: "e2e-cluster"
          # 可选的 peer 身份与地址环境变量；使用网卡地址时不需要 POD_IP。
          # - name: POD_NAME
          #   valueFrom:
          #     fieldRef:
          #       fieldPath: metadata.name
          # - name: POD_IP
          #   valueFrom:
          #     fieldRef:
          #       fieldPath: status.podIP
        # 启用同步后仍需允许 memberlist 双向 TCP/UDP；controller 不提供 7789 接收服务。
        # ports:
        #   - name: memberlist-tcp
        #     containerPort: 7946
        #     protocol: TCP
        #   - name: memberlist-udp
        #     containerPort: 7946
        #     protocol: UDP
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      # gate 默认关闭时保留 E2E 停机配置；启用同步的部署需为 30 秒清理预算预留余量（例如 40 秒）。
      terminationGracePeriodSeconds: 10
